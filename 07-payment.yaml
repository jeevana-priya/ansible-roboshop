- name: configure payment server
  hosts: payment
  become: yes
  tasks:
  - name: install python
    package:
      name: "{{ item }}"
      status: present
    loop:
    - python3
    - gcc
    - python3-devel -y
  - name: Create the application service user
    user:
      name: roboshop
      system: true 
      home: /app
      shell: /sbin/nologin  # Prevents direct interactive SSH login for security
      comment: "Roboshop System user"
  - name: delete app directory
    file:
      path: /app
      state: absent
  
  - name: remove payment.zip
    file:
      path: /tmp/payment.zip
      state: absent

  - name: Create the application deployment directory
    ansible.builtin.file:
      path: /app
      state: directory
  - name: download payment
    get_url:
      url: https://roboshop-artifacts.s3.amazonaws.com/payment-v3.zip 
      dest: /tmp/payment.zip
  - name: unzip
    unarchive:
      src: /tmp/payment.zip
      dest: /app
      remote_src: yes
  - name: install dependencies
    pip: 
      requirements: requirements.txt
      executable: pip3.9
    args:
      chdir: /app
  - name: copy payment service
    template:
      src: payment.service.j2
      dest: /etc/systemd/system/payment.service
  - name: deamon reload
    systemd_service:
      name: payment
      daemon_reload: true
  - name: enable and start payment
    service:
      name: payment
      state: restarted
      enabled: yes
    

    