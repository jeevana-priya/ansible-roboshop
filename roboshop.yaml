- name: roboshop instance creation
  hosts: local
  connection: local
  vars:
    instances: ["mongodb"]
    image_id: ami-0220d79f3f480ecf5
  tasks:
  - name: create instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      image_id: "{{ image_id }}"
      instance_type: t3.micro
      region: us-east-1
      vpc_subnet_id: subnet-0bcdf0124041a31dc
    loop: "{{ instances }}"
    register: ec2_output
  
  - name: print output
    debug:
      msg: "{{ ec2_output }}"
    