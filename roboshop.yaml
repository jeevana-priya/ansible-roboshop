- name: roboshop instance creation
  hosts: local
  connection: local
  vars:
    instances: ["mongodb","redis","mysql"]
    image_id: ami-0220d79f3f480ecf5
  tasks:
  - name: create instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      instance_type: t3.micro
      security_group: 
      - "roboshop-{{ item}}"
      - roboshop-common
      image_id: "{{ image_id }}"
    loop: "{{ instances }}"
    register: ec2_output
  
  - name: print output
    debug:
      msg: "{{ ec2_output }}"
    