- name: creating instances in ec2
  hosts: local
  connection: local

  vars:
    instances: ["mongodb","redis"]
    image_id: ami-0220d79f3f480ecf5

  tasks:
  - name: create instance
    amazon.aws.ec2_instance:
      name: "roboshop-{{ item }}"
      vpc_subnet_id: subnet-0bcdf0124041a31dc
      instance_type: t3.micro
      security_groups: 
        - "roboshop-{{ item }}"
        - roboshop-common
      image_id: "{{ image_id }}"
    loop: "{{ instances }}"
    register: ec2_output

  - name: print ec2 output
    debug:
      msg: "{{ ec2_output }}"
